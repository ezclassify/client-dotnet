name: vendor-readonly

# Gates every change that touches vendor/spec/ or vendor/SPEC.md.
# Those paths mirror the OpenAPI document and conformance corpus owned by
# ezclassify/contracts. The EzClassify spec bot writes them under the
# `ezclassify-spec-bot` GitHub App identity; nothing in this repo may hand-edit
# the mirror.
#
# Exact admitted bot author addresses: the App-created short address and
# 348097708+ezclassify-spec-bot[bot]@users.noreply.github.com on GitHub squash.
# Both require the exact bot name; other numeric IDs/addresses are refused.
#
# Two gates run in series:
#   1. Identity gate. On a pull request the PR must be opened by
#      `ezclassify-spec-bot[bot]` AND every vendor/-touching commit in it must
#      be authored by that identity, unless the PR carries the
#      spec-mirror-override label (the maintainer override). On a direct push
#      there is no PR and no label, so only the per-commit author check applies
#      and it has no bypass.
#
#      The per-commit check compares the full `name <email>` pair the spec bot
#      commits with. Comparing the name alone would admit a commit wearing the
#      bot's display name over someone else's address, and the push path has
#      no PR-author layer behind it.
#   2. Subject gate. Every commit touching vendor/ must have a subject starting
#      with `chore(spec):`.
# Either failure blocks the change.
#
# What these gates do and do not do: they stop accidents. A maintainer who
# edits the mirror by hand is refused, because their own git identity and
# their own subject line ride on the commit and neither one matches. A vendor/
# path dragged in by a rebase or a merge is refused the same way.
#
# They are not an authentication boundary. `%an` and `%ae` are free-text fields
# in the commit object, chosen by whoever writes the commit, and GitHub
# verifies neither. Two lines of setup:
#     git config user.name  "ezclassify-spec-bot[bot]"
#     git config user.email "ezclassify-spec-bot[bot]@users.noreply.github.com"
# plus a `chore(spec):` subject produce a commit this workflow admits on the
# push path and on the bot-PR path alike. Authenticating the mirror would take
# branch protection on the vendored paths or verified commit signatures; both
# are repository settings, not part of this workflow.
#
# Both identity layers run on the pull-request path. The PR author is the
# GitHub-verified layer and stops a human opening a PR full of hand-edited
# mirror; the per-commit author stops a non-bot commit riding along on a branch
# the bot opened. They catch different things.
#
# Both triggers are load-bearing. `pull_request` covers the spec bot's pull
# requests; `push` covers commits that land on a branch directly, which is how
# spec updates usually arrive.
#
# The two path lists are written out twice rather than shared through a YAML
# anchor because GitHub Actions does not resolve anchors in workflow files.
# They must stay identical; VendorReadonlyWorkflowTests asserts it.

on:
  pull_request:
    paths:
      - 'vendor/spec/**'
      - 'vendor/SPEC.md'
  push:
    # No branch filter. A vendor/ commit is gated wherever it lands, not only
    # on the default branch.
    paths:
      - 'vendor/spec/**'
      - 'vendor/SPEC.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-vendor-changes:
    name: Reject unauthorized vendor/ changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve the commit range this event introduced
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_FORCED: ${{ github.event.forced }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request event: checking ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            {
              echo "mode=range"
              echo "base=$PR_BASE_SHA"
              echo "head=$PR_HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push path. Resolve the widest range this checkout can actually
          # inspect, then degrade one step at a time. What must never happen is
          # a range that resolves EMPTY while the push touched vendor/ paths:
          # the gate would exit 0 having read no commits, which is the exact
          # failure this workflow exists to prevent. The last resort is the HEAD
          # commit plus a warning naming what went uninspected, and if even that
          # turns up nothing the enforcement step refuses.
          #
          # A branch-creation push (before = all zeros) is NOT an error here.
          # The spec bot creates `chore/spec-update-<sha>` and pushes it, so
          # refusing branch creation would block the sanctioned writer.
          ZERO=0000000000000000000000000000000000000000
          HEAD_SHA="${PUSH_AFTER:-$(git rev-parse HEAD)}"

          BASE=""
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$PUSH_BEFORE" "$HEAD_SHA" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
            echo "Range: recorded pre-push commit $PUSH_BEFORE..$HEAD_SHA"
          else
            if [ "$PUSH_FORCED" = "true" ]; then
              REASON="force-push: recorded pre-push commit $PUSH_BEFORE is not an ancestor of $HEAD_SHA"
            elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$ZERO" ]; then
              REASON="branch creation: this push has no pre-push commit"
            else
              REASON="recorded pre-push commit $PUSH_BEFORE is not in this checkout"
            fi
            echo "NOTE: $REASON."
            echo "      Falling back to commits reachable from HEAD but not"
            echo "      from origin/${DEFAULT_BRANCH}."

            FALLBACK="origin/${DEFAULT_BRANCH}"
            # `--is-ancestor`, not a string comparison. If HEAD is already an
            # ancestor of the default branch then `origin/<default>..HEAD` is
            # EMPTY, and an inequality test would hand that empty range to the
            # gate, which would then print "No commits touch vendor/ paths" and
            # exit 0 having read nothing.
            if git rev-parse --verify --quiet "${FALLBACK}^{commit}" >/dev/null \
              && ! git merge-base --is-ancestor "$HEAD_SHA" "$FALLBACK" 2>/dev/null; then
              BASE="$FALLBACK"
              echo "Range: $FALLBACK..$HEAD_SHA"
            fi
          fi

          if [ -n "$BASE" ] && [ -n "$(git log "$BASE..$HEAD_SHA" --format='%H')" ]; then
            {
              echo "mode=range"
              echo "base=$BASE"
              echo "head=$HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo
          echo "WARNING: the commit range this push introduced could not be"
          echo "         resolved. Inspecting the HEAD commit $HEAD_SHA ONLY."
          echo "         NOT INSPECTED: every other commit this push may have"
          echo "         introduced, i.e. everything reachable from $HEAD_SHA"
          echo "         that is not reachable from origin/${DEFAULT_BRANCH}"
          echo "         except $HEAD_SHA itself. If any of those touched"
          echo "         vendor/, they went through this gate unchecked."
          echo
          {
            echo "mode=single"
            echo "base="
            echo "head=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce bot identity + commit-subject for vendor/ commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          RANGE_MODE: ${{ steps.range.outputs.mode }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Comma-separated list of PR labels (only spec-mirror-override, the
          # explicit maintainer override, matters here).
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ALLOWED_BOT_LOGIN: ezclassify-spec-bot[bot]
          # The exact git author identity the spec bot commits with. The
          # per-commit gate matches the whole `name <email>` pair against it;
          # see the header note on why the name alone is not an identity.
          ALLOWED_BOT_EMAIL: ezclassify-spec-bot[bot]@users.noreply.github.com
          # GitHub preserves this verified bot account when squash-merging its PR.
          # Admit only this exact ID/address, never an arbitrary numeric prefix.
          ALLOWED_BOT_CANONICAL_EMAIL: 348097708+ezclassify-spec-bot[bot]@users.noreply.github.com
          OVERRIDE_LABEL: spec-mirror-override
        run: |
          set -euo pipefail

          # Collect commits that touch vendor/spec/ or
          # vendor/SPEC.md. In `single` mode the previous step could not bound
          # the push and already printed what it could not see; the only commit
          # this step can read is HEAD itself.
          if [ "$RANGE_MODE" = "single" ]; then
            # `diff-tree`, not `git log -1 <sha> -- <paths>`. The log form
            # WALKS: given a HEAD that does not touch vendor/ it returns the
            # nearest ancestor that does, so the gate would report
            # inspecting HEAD while actually inspecting some older commit that
            # was never part of this push.
            #
            # A merge commit yields no output here, so it falls through to the
            # empty-set refusal below. That is the safe direction.
            VENDOR_COMMITS=""
            if [ -n "$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" \
              -- 'vendor/spec/' 'vendor/SPEC.md')" ]; then
              VENDOR_COMMITS="$HEAD_SHA"
            fi
          else
            VENDOR_COMMITS=$(git log "$BASE_SHA..$HEAD_SHA" --format='%H' \
              -- 'vendor/spec/' 'vendor/SPEC.md')
          fi

          if [ -z "$VENDOR_COMMITS" ]; then
            # On a push the workflow only ran because the push touched a
            # watched path. Finding nothing therefore means the commit set this
            # step could read is not the set that was pushed, so passing here
            # would report green having inspected nothing. Only the pull_request path may legitimately come up
            # empty (a re-run after the vendor commits left the branch).
            if [ "$EVENT_NAME" != "pull_request" ] && [ "$RANGE_MODE" = "single" ]; then
              echo "ERROR: this push touched vendor/ paths (that is why this"
              echo "       workflow ran), the pushed commit range could not be"
              echo "       resolved, and HEAD $HEAD_SHA does not touch vendor/"
              echo "       itself. The commits that did touch vendor/ are"
              echo "       therefore unreadable here and this gate has checked"
              echo "       nothing. Refusing to pass."
              echo
              echo "       Re-push the branch on top of the default branch so"
              echo "       the range resolves, or land the change through the"
              echo "       spec bot's pull request."
              exit 1
            fi
            echo "No commits touch vendor/ paths, nothing to check."
            exit 0
          fi

          echo "Commits touching vendor/:"
          echo "$VENDOR_COMMITS"
          echo

          # ---------- Identity gate ----------
          # A maintainer can override the whole identity gate by attaching the
          # spec-mirror-override label. Labels only exist on pull_request
          # events, so a push is never bypassable.
          OVERRIDE_APPLIED=0
          if [ "$EVENT_NAME" = "pull_request" ]; then
            case ",$PR_LABELS," in
              *",${OVERRIDE_LABEL},"*) OVERRIDE_APPLIED=1 ;;
            esac
          fi

          if [ "$OVERRIDE_APPLIED" -eq 1 ]; then
            echo "Identity gate: bypassed by ${OVERRIDE_LABEL} label (maintainer override, pull requests only)"
          else
            # PR-level author, the one GitHub-verified layer in this workflow.
            # A commit author is just a string in the object header and anyone
            # can set it; who opened the pull request is not. Only checked on
            # pull_request, where the field exists, so the push path has no
            # verified layer at all. See the header.
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_AUTHOR" != "$ALLOWED_BOT_LOGIN" ]; then
              echo "ERROR: PR touches vendor/ but is authored by '$PR_AUTHOR',"
              echo "       not '$ALLOWED_BOT_LOGIN'."
              echo
              echo "vendor/spec/ and vendor/SPEC.md are written"
              echo "exclusively by the EzClassify spec bot, mirroring"
              echo "ezclassify/contracts under the ezclassify-spec-bot GitHub"
              echo "App identity."
              echo
              echo "A maintainer who must land this change can attach the"
              echo "'${OVERRIDE_LABEL}' label to bypass the identity gate."
              exit 1
            fi

            # Per-commit author, name AND email. Catches a non-bot commit
            # riding along on a branch the bot opened, which the PR-level check
            # above cannot see, and a commit that wears the bot's display name
            # over someone else's address, which a name-only comparison would
            # admit. Both are mistakes, not attacks; a writer who sets one
            # header sets the other just as easily.
            WRONG_AUTHOR=""
            for SHA in $VENDOR_COMMITS; do
              AUTHOR=$(git log -1 --format='%an <%ae>' "$SHA")
              if [ "$AUTHOR" != "$ALLOWED_BOT_LOGIN <$ALLOWED_BOT_EMAIL>" ] &&
                 [ "$AUTHOR" != "$ALLOWED_BOT_LOGIN <$ALLOWED_BOT_CANONICAL_EMAIL>" ]; then
                WRONG_AUTHOR="$WRONG_AUTHOR  $SHA  $AUTHOR"$'\n'
              fi
            done
            if [ -n "$WRONG_AUTHOR" ]; then
              echo "ERROR: vendor/-touching commits not authored by"
              echo "       '$ALLOWED_BOT_LOGIN <$ALLOWED_BOT_EMAIL>':"
              printf "%s" "$WRONG_AUTHOR"
              echo
              echo "vendor/spec/ and vendor/SPEC.md are written"
              echo "exclusively by the EzClassify spec bot, mirroring"
              echo "ezclassify/contracts under the ezclassify-spec-bot GitHub"
              echo "App identity. To change what is vendored, change the source"
              echo "in contracts and let the spec bot propagate it; do not"
              echo "edit vendor/ here."
              echo
              echo "There is no label bypass on the push path. If a human"
              echo "genuinely has to touch vendor/, open a pull request and"
              echo "use the '${OVERRIDE_LABEL}' label there."
              exit 1
            fi
            echo "Identity gate: every vendor/ commit authored by ${ALLOWED_BOT_LOGIN} <${ALLOWED_BOT_EMAIL}> or <${ALLOWED_BOT_CANONICAL_EMAIL}>"
          fi

          # ---------- Commit-subject gate ----------
          # Every commit touching vendor/ must have a subject starting with
          # `chore(spec):`. A second accident check, not a second
          # authentication factor: it catches a commit that reached vendor/ by
          # some route other than the spec bot, such as a rebase that dragged
          # the mirror along, a merge, or a hand-edit that copied the author
          # identity and kept its own subject. Whoever can set the author header can also
          # type this subject, so the two gates are one control against mistakes
          # rather than two hurdles for an attacker. See the header.
          DISALLOWED=""
          for SHA in $VENDOR_COMMITS; do
            SUBJECT=$(git log -1 --format='%s' "$SHA")
            if ! echo "$SUBJECT" | grep -qE '^chore\(spec\):'; then
              DISALLOWED="$DISALLOWED  $SHA  $SUBJECT"$'\n'
            fi
          done

          if [ -n "$DISALLOWED" ]; then
            echo
            echo "ERROR: vendor/-touching commits with disallowed subject:"
            printf "%s" "$DISALLOWED"
            echo
            echo "Every commit touching vendor/spec/ or vendor/SPEC.md"
            echo "must have a subject starting with"
            echo "'chore(spec):'. Refresh the mirror through the spec bot"
            echo "instead of editing it by hand."
            exit 1
          fi

          echo "All vendor/ commits pass identity + subject gates."
